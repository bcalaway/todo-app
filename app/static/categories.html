<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --fg: #e6e6e6;
    --muted: #9aa0a6;
    --card: #1a1d24;
    --border: #2a2e37;
    --accent: #4a90e2;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .container { max-width: 640px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  nav { margin-bottom: 1.5rem; }
  nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  nav a:hover { color: var(--accent); }
  h1 { font-weight: 600; font-size: 1.75rem; margin: 0 0 1.5rem; }

  input[type=text] {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-size: 0.95rem;
    font-family: inherit;
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }

  button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 0.55rem 0.9rem;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  button:hover { border-color: var(--accent); }
  button[type=submit] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button[type=submit]:hover { opacity: 0.9; }

  form#add-form { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; }
  form#add-form input[type=text] { flex: 1; }

  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.6rem; }
  li {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.85rem 1.1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  li span.name { flex: 1; }
</style>
</head>
<body>
<div class="container">
<nav><a href="/">Back to todos</a></nav>
<h1>Categories</h1>
<form id="add-form">
  <input type="text" id="new-name" placeholder="New category" required>
  <button type="submit">Add</button>
</form>
<ul id="category-list"></ul>
</div>
<script>
async function loadCategories() {
  const res = await fetch("/api/categories");
  const categories = await res.json();
  const list = document.getElementById("category-list");
  list.innerHTML = "";
  for (const category of categories) {
    const li = document.createElement("li");

    const span = document.createElement("span");
    span.className = "name";
    span.textContent = category.name;

    const rename = document.createElement("button");
    rename.textContent = "Rename";
    rename.onclick = () => renameCategory(category.id, category.name);

    const del = document.createElement("button");
    del.textContent = "Delete";
    del.onclick = () => deleteCategory(category.id);

    li.append(span, rename, del);
    list.appendChild(li);
  }
}

async function renameCategory(id, currentName) {
  const name = prompt("Rename category", currentName);
  if (!name || name === currentName) return;
  const res = await fetch(`/api/categories/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name }),
  });
  if (!res.ok) {
    alert("That name is already in use.");
    return;
  }
  loadCategories();
}

async function deleteCategory(id) {
  if (!confirm("Delete this category? Todos using it will keep their title but lose the category.")) return;
  await fetch(`/api/categories/${id}`, { method: "DELETE" });
  loadCategories();
}

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("new-name");
  const res = await fetch("/api/categories", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: input.value }),
  });
  if (!res.ok) {
    alert("That name is already in use.");
    return;
  }
  input.value = "";
  loadCategories();
});

loadCategories();
</script>
</body>
</html>
