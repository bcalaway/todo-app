<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Todo</title>
<style>
  body { font-family: sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  nav { margin-bottom: 16px; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
  li.completed span.title { text-decoration: line-through; color: #888; }
  li.archived { opacity: 0.6; }
  li span.title { flex: 1; }
  li span.meta { color: #888; font-size: 0.85em; white-space: nowrap; }
  form#add-form { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type=text] { flex: 1; }
  select.category-select { max-width: 140px; }
  .toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 8px; font-size: 0.9em; }
  .toolbar label { display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<nav><a href="/categories">Manage categories</a></nav>
<h1>Todo</h1>
<form id="add-form">
  <input type="text" id="new-title" placeholder="New todo" required>
  <select id="new-category"></select>
  <button type="submit">Add</button>
</form>
<div class="toolbar">
  <label>
    Category:
    <select id="category-filter"><option value="">All</option></select>
  </label>
  <label>
    <input type="checkbox" id="show-archived">
    Show archived
  </label>
</div>
<ul id="todo-list"></ul>
<script>
let categories = [];
let todos = [];

function formatTimestamp(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, {
    year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
  });
}

function populateCategorySelect(select, selectedId, { includeAll = false } = {}) {
  select.innerHTML = "";
  if (includeAll) {
    const allOption = document.createElement("option");
    allOption.value = "";
    allOption.textContent = "All";
    select.appendChild(allOption);
  }
  const noneOption = document.createElement("option");
  noneOption.value = includeAll ? "none" : "";
  noneOption.textContent = "No category";
  select.appendChild(noneOption);
  for (const category of categories) {
    const option = document.createElement("option");
    option.value = category.id;
    option.textContent = category.name;
    if (selectedId != null && String(category.id) === String(selectedId)) option.selected = true;
    select.appendChild(option);
  }
}

async function loadCategories() {
  const res = await fetch("/api/categories");
  categories = res.ok ? await res.json() : [];
  populateCategorySelect(document.getElementById("new-category"), null);
  populateCategorySelect(document.getElementById("category-filter"), null, { includeAll: true });
}

function renderTodos() {
  const showArchived = document.getElementById("show-archived").checked;
  const categoryFilter = document.getElementById("category-filter").value;

  const visible = todos.filter((todo) => {
    if (!showArchived && todo.archived) return false;
    if (categoryFilter === "none" && todo.category_id != null) return false;
    if (categoryFilter && categoryFilter !== "none" && String(todo.category_id) !== categoryFilter) return false;
    return true;
  });

  const list = document.getElementById("todo-list");
  list.innerHTML = "";
  for (const todo of visible) {
    const li = document.createElement("li");
    if (todo.completed) li.classList.add("completed");
    if (todo.archived) li.classList.add("archived");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = todo.completed;
    checkbox.onchange = () => toggleTodo(todo.id, checkbox.checked);

    const span = document.createElement("span");
    span.className = "title";
    span.textContent = todo.title;

    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = formatTimestamp(todo.created_at);

    const categorySelect = document.createElement("select");
    categorySelect.className = "category-select";
    populateCategorySelect(categorySelect, todo.category_id);
    categorySelect.onchange = () => setTodoCategory(todo.id, categorySelect.value);

    const editBtn = document.createElement("button");
    editBtn.textContent = "Edit";
    editBtn.onclick = () => editTodo(todo.id, todo.title);

    const archiveBtn = document.createElement("button");
    archiveBtn.textContent = todo.archived ? "Restore" : "Archive";
    archiveBtn.onclick = () => setTodoArchived(todo.id, !todo.archived);

    li.append(checkbox, span, meta, categorySelect, editBtn, archiveBtn);
    list.appendChild(li);
  }
}

async function loadTodos() {
  const res = await fetch("/api/todos");
  todos = await res.json();
  renderTodos();
}

async function toggleTodo(id, completed) {
  await fetch(`/api/todos/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ completed }),
  });
  loadTodos();
}

async function setTodoCategory(id, categoryId) {
  await fetch(`/api/todos/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ category_id: categoryId === "" ? null : Number(categoryId) }),
  });
  loadTodos();
}

async function setTodoArchived(id, archived) {
  await fetch(`/api/todos/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ archived }),
  });
  loadTodos();
}

async function editTodo(id, currentTitle) {
  const title = prompt("Edit todo", currentTitle);
  if (!title || title === currentTitle) return;
  await fetch(`/api/todos/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title }),
  });
  loadTodos();
}

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("new-title");
  const categorySelect = document.getElementById("new-category");
  await fetch("/api/todos", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      title: input.value,
      category_id: categorySelect.value === "" ? null : Number(categorySelect.value),
    }),
  });
  input.value = "";
  loadTodos();
});

document.getElementById("category-filter").addEventListener("change", renderTodos);
document.getElementById("show-archived").addEventListener("change", renderTodos);

(async () => {
  await loadCategories();
  await loadTodos();
})();
</script>
</body>
</html>
