<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f1115;
    --fg: #e6e6e6;
    --muted: #9aa0a6;
    --card: #1a1d24;
    --border: #2a2e37;
    --accent: #4a90e2;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .container { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }
  nav { margin-bottom: 1.5rem; }
  nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  nav a:hover { color: var(--accent); }
  h1 { font-weight: 600; font-size: 1.75rem; margin: 0 0 1.5rem; }

  input[type=text], select {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-size: 0.95rem;
    font-family: inherit;
  }
  input[type=text]:focus, select:focus { outline: none; border-color: var(--accent); }

  button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--fg);
    border-radius: 8px;
    padding: 0.55rem 0.9rem;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }
  button:hover { border-color: var(--accent); }
  button[type=submit] { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button[type=submit]:hover { opacity: 0.9; }

  form#add-form { display: flex; gap: 0.6rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  form#add-form input[type=text] { flex: 1; min-width: 220px; }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 1.25rem;
    color: var(--muted);
    font-size: 0.9rem;
    flex-wrap: wrap;
  }
  .toolbar label { display: flex; align-items: center; gap: 0.4rem; }
  .toolbar select { padding: 0.35rem 0.5rem; font-size: 0.85rem; }
  .toolbar input[type=checkbox] { accent-color: var(--accent); }

  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.6rem; }
  li {
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.85rem 1.1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  li.completed span.title { text-decoration: line-through; color: var(--muted); }
  li.archived { opacity: 0.55; }
  li span.title { flex: 1; min-width: 140px; }
  li span.meta { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
  li input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); flex-shrink: 0; }
  select.category-select { max-width: 160px; }
</style>
</head>
<body>
<div class="container">
<nav><a href="/categories">Manage categories</a></nav>
<h1>Todo</h1>
<form id="add-form">
  <input type="text" id="new-title" placeholder="New todo" required>
  <select id="new-category"></select>
  <button type="submit">Add</button>
</form>
<div class="toolbar">
  <label>
    Category:
    <select id="category-filter"><option value="">All</option></select>
  </label>
  <label>
    <input type="checkbox" id="show-archived">
    Show archived
  </label>
</div>
<ul id="todo-list"></ul>
</div>
<script>
let categories = [];
let todos = [];

function formatTimestamp(iso) {
  const d = new Date(iso);
  return d.toLocaleString(undefined, {
    year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit",
  });
}

function populateCategorySelect(select, selectedId, { includeAll = false } = {}) {
  select.innerHTML = "";
  if (includeAll) {
    const allOption = document.createElement("option");
    allOption.value = "";
    allOption.textContent = "All";
    select.appendChild(allOption);
  }
  const noneOption = document.createElement("option");
  noneOption.value = includeAll ? "none" : "";
  noneOption.textContent = "No category";
  select.appendChild(noneOption);
  for (const category of categories) {
    const option = document.createElement("option");
    option.value = category.id;
    option.textContent = category.name;
    if (selectedId != null && String(category.id) === String(selectedId)) option.selected = true;
    select.appendChild(option);
  }
}

async function loadCategories() {
  const res = await fetch("/api/categories");
  categories = res.ok ? await res.json() : [];
  populateCategorySelect(document.getElementById("new-category"), null);
  populateCategorySelect(document.getElementById("category-filter"), null, { includeAll: true });
}

function renderTodos() {
  const showArchived = document.getElementById("show-archived").checked;
  const categoryFilter = document.getElementById("category-filter").value;

  const visible = todos
    .filter((todo) => {
      if (!showArchived && todo.archived) return false;
      if (categoryFilter === "none" && todo.category_id != null) return false;
      if (categoryFilter && categoryFilter !== "none" && String(todo.category_id) !== categoryFilter) return false;
      return true;
    })
    // Stable sort (spec-guaranteed since ES2019) -- completed todos sink to
    // the bottom while everything else keeps its existing created_at order.
    .sort((a, b) => Number(a.completed) - Number(b.completed));

  const list = document.getElementById("todo-list");
  list.innerHTML = "";
  for (const todo of visible) {
    const li = document.createElement("li");
    if (todo.completed) li.classList.add("completed");
    if (todo.archived) li.classList.add("archived");

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = todo.completed;
    checkbox.onchange = () => toggleTodo(todo.id, checkbox.checked);

    const span = document.createElement("span");
    span.className = "title";
    span.textContent = todo.title;

    const meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = formatTimestamp(todo.created_at);

    const categorySelect = document.createElement("select");
    categorySelect.className = "category-select";
    populateCategorySelect(categorySelect, todo.category_id);
    categorySelect.onchange = () => setTodoCategory(todo.id, categorySelect.value);

    const editBtn = document.createElement("button");
    editBtn.textContent = "Edit";
    editBtn.onclick = () => editTodo(todo.id, todo.title);

    const archiveBtn = document.createElement("button");
    archiveBtn.textContent = todo.archived ? "Restore" : "Archive";
    archiveBtn.onclick = () => setTodoArchived(todo.id, !todo.archived);

    li.append(checkbox, span, meta, categorySelect, editBtn, archiveBtn);
    list.appendChild(li);
  }
}

async function loadTodos() {
  const res = await fetch("/api/todos");
  todos = await res.json();
  renderTodos();
}

async function toggleTodo(id, completed) {
  await fetch(`/api/todos/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ completed }),
  });
  loadTodos();
}

async function setTodoCategory(id, categoryId) {
  await fetch(`/api/todos/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ category_id: categoryId === "" ? null : Number(categoryId) }),
  });
  loadTodos();
}

async function setTodoArchived(id, archived) {
  await fetch(`/api/todos/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ archived }),
  });
  loadTodos();
}

async function editTodo(id, currentTitle) {
  const title = prompt("Edit todo", currentTitle);
  if (!title || title === currentTitle) return;
  await fetch(`/api/todos/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title }),
  });
  loadTodos();
}

document.getElementById("add-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("new-title");
  const categorySelect = document.getElementById("new-category");
  await fetch("/api/todos", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      title: input.value,
      category_id: categorySelect.value === "" ? null : Number(categorySelect.value),
    }),
  });
  input.value = "";
  loadTodos();
});

document.getElementById("category-filter").addEventListener("change", renderTodos);
document.getElementById("show-archived").addEventListener("change", renderTodos);

(async () => {
  await loadCategories();
  await loadTodos();
})();
</script>
</body>
</html>
